# builder-config.yaml — manifest for the OpenTelemetry Collector Builder (ocb).
#
# ocb reads this file, generates a Go main module under `output_path`, and
# compiles a single static binary containing ONLY the components listed here.
#
# IMPORTANT version rule: the ocb binary version and every collector `gomod`
# version below must come from the same release line (here: v0.156.0).

dist:
  name: otelcol-chopper
  description: Telemetry Chopper — OpenTelemetry observability firewall & cost-optimization pipeline (custom collector distribution)
  output_path: ./dist
  version: 0.1.0

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.156.0

processors:
  # Our custom in-process filter engine. The version here is a placeholder —
  # the `replaces` directive below redirects resolution to the local path.
  - gomod: github.com/PRIYAM232/telemetry-chopper/data-plane/processors/filterprocessor v0.1.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.156.0
  # OTLP out, so the proxy can forward to any real backend (Jaeger, Tempo,
  # Prometheus' OTLP receiver, Grafana Cloud, vendor OTLP intakes) without a
  # rebuild. Component types are otlp_grpc and otlp_http as of v0.156.0; the
  # old otlp / otlphttp names still resolve but are deprecated aliases.
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.156.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.156.0
  # Cold-storage sinks for ROUTE-to-archive pipelines (README: "Archiving to
  # cold storage"). All three are alpha upstream as of v0.156.0.
  #   awss3        — S3 bucket; storage_class GLACIER / GLACIER_IR / DEEP_ARCHIVE
  #   azure_blob   — Blob container; no access-tier option, so move blobs to
  #                  the Archive tier with an Azure lifecycle-management rule
  #   file         — local path or mounted NAS share, with rotation + zstd
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/awss3exporter v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/azureblobexporter v0.156.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.156.0

connectors:
  # Native OTel routing connector (the successor to the removed `routing`
  # processor): forks data between pipelines based on OTTL conditions over
  # resource attributes — in our case the chopper.routing.destination attribute
  # stamped by chopper_filter ROUTE rules.
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector v0.156.0

# Replace directives are copied verbatim into the go.mod that ocb generates
# inside `output_path` (./dist). Relative paths in a go.mod replace are
# resolved relative to that go.mod — hence `../`, not `./`.
replaces:
  - github.com/PRIYAM232/telemetry-chopper/data-plane/processors/filterprocessor => ../processors/filterprocessor
  # Security floor for gRPC. The v0.156.0 modules resolve
  # google.golang.org/grpc v1.82.0, which exposes every gRPC-Go server (here,
  # the OTLP receiver on :4317) to two unauthenticated remote DoS advisories:
  # GHSA-vp52-pcj8-j9qc (OOM via fragmented HTTP/2 DATA frames, fixed in
  # 1.83.1) and GHSA-hrxh-6v49-42gf (HTTP/2 Rapid Reset mitigation bypass,
  # fixed in 1.82.1). Remove once the collector release line requires
  # >= 1.83.1 itself; `go version -m dist/otelcol-chopper` shows what shipped.
  - google.golang.org/grpc => google.golang.org/grpc v1.83.2
  # Security floor for x/crypto. The v0.156.0 modules resolve
  # golang.org/x/crypto v0.55.0, which carries two x/crypto/ssh channel
  # deadlock DoS advisories: GO-2026-6354 (undecided channel) and
  # GO-2026-6355 (established channel), both fixed in v0.56.0. The collector
  # links no x/crypto/ssh code (govulncheck in source mode against dist/
  # reports them unreachable); they appear in `govulncheck -mode=binary`
  # only because ocb strips the symbol table (-s -w), which makes it flag
  # every vulnerable symbol in the module. Pinned anyway so binary scans of
  # the shipped artifact stay clean. GO-2026-5932 (x/crypto/openpgp is
  # deprecated) has no fixed version and is a false positive for the same
  # reason. Remove once the collector release line requires >= v0.56.0
  # itself; `go version -m dist/otelcol-chopper` shows what shipped.
  - golang.org/x/crypto => golang.org/x/crypto v0.56.0
  # Security floor for the collector's own OTLP log exporter. The v0.156.0
  # modules resolve go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc
  # v0.20.0, which ignores the OTEL_EXPORTER_OTLP_{,LOGS_}CERTIFICATE /
  # CLIENT_CERTIFICATE / CLIENT_KEY env vars, silently bypassing mTLS and CA
  # pinning when `service.telemetry.logs` ships the collector's internal logs
  # over OTLP gRPC: GO-2026-6508, fixed in v0.21.0 (reachable per govulncheck
  # in source mode against dist/). v0.21.0 needs otel/log v0.21.0, which
  # removed log.Value/log.KeyValue, so otelzap v0.19.0 no longer compiles; the
  # consistent set is otelconf v0.25.0 (requires otlploggrpc v0.21.0 and moves
  # the whole otel-go SDK/exporter set to v1.45.0 / v0.21.0) plus otelzap
  # v0.20.0 (built against log v0.21.0). Remove all three together once the
  # collector release line requires otlploggrpc >= v0.21.0 itself;
  # `go version -m dist/otelcol-chopper` shows what shipped.
  - go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc => go.opentelemetry.io/otel/exporters/otlp/otlplog/otlploggrpc v0.21.0
  - go.opentelemetry.io/contrib/otelconf => go.opentelemetry.io/contrib/otelconf v0.25.0
  - go.opentelemetry.io/contrib/bridges/otelzap => go.opentelemetry.io/contrib/bridges/otelzap v0.20.0
