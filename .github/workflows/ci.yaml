# Telemetry Chopper CI — validation for pull requests and pushes to main.
#
# Seven independent jobs, one per surface:
#   go              — vet, gofmt, race-enabled tests and govulncheck for
#                     every Go module: the chopper_filter engine, the
#                     chopper_datadog_passthrough extension and the sandbox
#                     load generator
#   collector-build — assembles the otelcol-chopper distro with ocb, proving
#                     builder-config.yaml and the processor still compose,
#                     then runs govulncheck on the generated module (what ships)
#   collector-packages — GoReleaser snapshot of every release artifact
#                     (archives, .deb, .rpm, Homebrew cask), then installs the
#                     .deb on the runner and checks the service starts
#   control-plane   — ESLint + Prisma schema validation
#   control-plane-test — Vitest against a real PostgreSQL service container,
#                     migrated with `prisma migrate deploy`
#   helm            — chart lint + full renders with the Phase 10
#                     monitoring toggles and every cold-storage archive on,
#                     so gated templates can't rot
#   image-scan      — builds the three release images and fails on CRITICAL
#                     CVEs (Trivy), so a vulnerable base never reaches a tag
#   sandbox-image   — build-only check of the local loadgen image (never
#                     published, so no Trivy gate and no release.yaml entry)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the collector line in data-plane/builder-config.yaml and the
  # Makefile's OCB_VERSION.
  OCB_VERSION: v0.156.0
  # Pinned so a scanner release can't change results under us; installed via
  # `go install` (checksum-verified by the Go sumdb) rather than a
  # third-party action. Bump deliberately.
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  go:
    name: Go ${{ matrix.module }} (vet + gofmt + test -race)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One entry per go.mod in the repo — each module has its own go.sum,
      # so each gets its own working directory and module cache key.
      matrix:
        include:
          - module: filterprocessor
            dir: data-plane/processors/filterprocessor
          # chopper_datadog_passthrough. Its tests run the stock contrib
          # datadog receiver with the middleware attached, so an upstream
          # change that breaks the composition fails here.
          - module: datadogpassthrough
            dir: data-plane/extensions/datadogpassthrough
          # The sandbox load generator. Its pii_test.go pins the REDACT
          # pattern documented in deploy/sandbox/README.md against every PII
          # shape the generator emits, so drift in either side fails here.
          - module: loadgen
            dir: deploy/sandbox/loadgen
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          # Resolve the newest 1.26 patch rather than whatever the runner
          # image caches, or govulncheck fails on stdlib advisories that a
          # released patch already fixes.
          check-latest: true
          cache-dependency-path: ${{ matrix.dir }}/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test -race
        run: go test -race ./...
      # The allocation guards skip under -race, which makes sync.Pool drop
      # items at random, so run them once more without it.
      - name: allocation guards
        run: go test -run 'Allocat' ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  collector-build:
    name: Collector distro (ocb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: data-plane/processors/filterprocessor/go.sum
      - name: Install OpenTelemetry Collector Builder
        run: go install go.opentelemetry.io/collector/cmd/builder@${{ env.OCB_VERSION }}
      - name: Assemble otelcol-chopper
        working-directory: data-plane
        run: builder --config builder-config.yaml
      # Every collector config the repo ships must load in this build, so a
      # config naming a component missing from builder-config.yaml, or a
      # broken OTTL statement, fails here instead of at deploy time. The Helm
      # chart's config is rendered with the optional Datadog receiver and hot
      # backend on, and persistent queues off (their directory only exists in
      # the pod).
      - uses: azure/setup-helm@v4
      - name: Shipped collector configs load
        env:
          CHOPPER_FLEET_KEY: ci
          POD_NAME: ci
          DD_API_KEY: ci
          DD_SITE: datadoghq.com
        run: |
          helm template chopper deploy/helm/telemetry-chopper \
            --set collector.datadogReceiver.enabled=true \
            --set collector.datadogReceiver.agentPassthrough.endpoint=http://datadog-agent:8126 \
            --set collector.hotBackend.otlp.endpoint=datadog-agent:4317 \
            --set collector.persistentQueue.enabled=false \
            --show-only templates/configmap-collector.yaml \
            | sed -n '/otelcol-k8s.yaml: |/,$p' | tail -n +2 | sed 's/^    //' \
            > "$RUNNER_TEMP/otelcol-k8s.yaml"
          # otelcol-standalone.yaml also loads the example rules file the
          # packages install.
          for f in data-plane/config/otelcol-dev.yaml data-plane/config/otelcol-standalone.yaml \
                   deploy/docker/otelcol-docker.yaml \
                   deploy/datadog/otelcol-datadog.yaml deploy/datadog/otelcol-datadog-direct.yaml \
                   "$RUNNER_TEMP/otelcol-k8s.yaml"; do
            echo "== $f"
            data-plane/dist/otelcol-chopper validate --config "$f"
          done
      # Source mode against the go.mod ocb generated in dist/, so the
      # builder-config.yaml `replaces:` security pins are in effect and only
      # vulnerabilities on a real call path fail the build. Not -mode=binary:
      # ocb strips the binary (-s -w), and without symbols govulncheck flags
      # every vulnerable function in every dependency module (false positives
      # such as GO-2026-5932, see #24). Blocking, unfixed advisories included:
      # a reachable one needs a pin, a code change or a deliberate decision.
      - name: govulncheck (collector distro)
        working-directory: data-plane/dist
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  collector-packages:
    name: Collector packages (GoReleaser snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: data-plane/processors/filterprocessor/go.sum
      - name: Install OpenTelemetry Collector Builder
        run: go install go.opentelemetry.io/collector/cmd/builder@${{ env.OCB_VERSION }}
      # Everything the release job builds (archives, .deb, .rpm, cask), with
      # nothing published or signed, so packaging breaks in review rather
      # than on a release tag.
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign,sbom
      - name: Packaged config and rules pass validation
        run: |
          tar xzf dist/otelcol-chopper_*_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          CHOPPER_RULES_FILE=./rules.yaml ./otelcol-chopper validate --config config.yaml
      - name: .deb installs and the service starts
        run: |
          sudo dpkg -i dist/telemetry-chopper_*_amd64.deb
          otelcol-chopper --version
          sudo -u telemetry-chopper otelcol-chopper validate --config /etc/telemetry-chopper/config.yaml
          systemctl is-active telemetry-chopper
          sudo dpkg --purge telemetry-chopper

  control-plane:
    name: Control plane (lint + Prisma)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    env:
      # prisma.config.ts resolves DATABASE_URL at load time; nothing connects
      # during validate, so any well-formed URL satisfies it (same trick as
      # the Dockerfile's build stage).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prisma schema validation
        run: npx prisma validate
      - name: Prisma client generates cleanly
        run: npx prisma generate

  control-plane-test:
    name: Control plane tests (Vitest + PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    services:
      # Same major version as deploy/docker/docker-compose.yaml.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chopper
          POSTGRES_PASSWORD: chopper
          POSTGRES_DB: chopper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chopper -d chopper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # test/global-setup.ts applies every migration to this database, and
      # the tests empty its tables between cases.
      TEST_DATABASE_URL: postgresql://chopper:chopper@localhost:5432/chopper_test
      # prisma.config.ts reads DATABASE_URL when `prisma generate` loads it;
      # the tests themselves use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://chopper:chopper@localhost:5432/chopper_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: control-plane/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Vitest
        run: npm test

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/telemetry-chopper
      - name: Render with self-monitoring enabled
        run: >
          helm template chopper deploy/helm/telemetry-chopper
          --set metrics.serviceMonitor.enabled=true
          --set metrics.dashboard.enabled=true
          > /dev/null
      - name: Render with every cold-storage archive enabled
        run: >
          helm template chopper deploy/helm/telemetry-chopper
          --set collector.serviceAccount.create=true
          --set collector.coldStorage.s3.enabled=true
          --set collector.coldStorage.s3.bucket=ci-bucket
          --set collector.coldStorage.azureBlob.enabled=true
          --set collector.coldStorage.azureBlob.url=https://ci.blob.core.windows.net/
          --set collector.coldStorage.file.enabled=true
          --set collector.coldStorage.file.volume.emptyDir.medium=Memory
          > /dev/null
      - name: Incomplete cold-storage settings fail the render
        run: |
          if helm template chopper deploy/helm/telemetry-chopper \
               --set collector.coldStorage.s3.enabled=true > /dev/null 2>&1; then
            echo "expected s3.enabled without s3.bucket to fail the render"; exit 1
          fi
      - name: Fleet key stays out of the collector ConfigMap
        run: |
          chart=deploy/helm/telemetry-chopper
          canary=chopper_sk_ci_canary_value
          if helm template chopper "$chart" --set fleet.key="$canary" \
               --show-only templates/configmap-collector.yaml | grep -q "$canary"; then
            echo "the fleet key was rendered into the collector ConfigMap"; exit 1
          fi
          helm template chopper "$chart" --set fleet.key="$canary" \
            --show-only templates/secret-fleet.yaml | grep -q "$canary"
      - name: Datadog receiver and hot backend render only when set
        run: |
          chart=deploy/helm/telemetry-chopper
          on=$(helm template chopper "$chart" --set collector.datadogReceiver.enabled=true \
                 --set collector.hotBackend.otlp.endpoint=datadog-agent:4317)
          grep -q 'receivers: \[otlp, datadog\]' <<<"$on"
          grep -q 'transform/datadog' <<<"$on"
          grep -q 'name: datadog-apm' <<<"$on"
          test "$(grep -c 'exporters: \[otlp_grpc/hot\]' <<<"$on")" -eq 3
          if helm template chopper "$chart" | grep -q -E 'datadog-apm|transform/datadog|otlp_grpc/hot'; then
            echo "the Datadog receiver or hot backend rendered without being set"; exit 1
          fi
          # The Agent passthrough needs both the receiver and an endpoint.
          pass=$(helm template chopper "$chart" --set collector.datadogReceiver.enabled=true \
                   --set collector.datadogReceiver.agentPassthrough.endpoint=http://datadog-agent:8126)
          grep -q -- '- id: chopper_datadog_passthrough' <<<"$pass"
          grep -q 'compression_algorithms: \[\]' <<<"$pass"
          grep -q 'endpoint: "http://datadog-agent:8126"' <<<"$pass"
          grep -q 'extensions: \[file_storage, chopper_datadog_passthrough\]' <<<"$pass"
          if grep -q chopper_datadog_passthrough <<<"$on" ||
             helm template chopper "$chart" --set collector.datadogReceiver.agentPassthrough.endpoint=http://x:8126 \
               | grep -q chopper_datadog_passthrough; then
            echo "the Datadog Agent passthrough rendered without the receiver and an endpoint"; exit 1
          fi
      - name: Render with an existing fleet key Secret
        run: >
          helm template chopper deploy/helm/telemetry-chopper
          --set fleet.existingSecret=chopper-fleet --set fleet.key=
          > /dev/null
      - name: A missing fleet key fails the render
        run: |
          if helm template chopper deploy/helm/telemetry-chopper \
               --set fleet.key= > /dev/null 2>&1; then
            echo "expected an empty fleet.key without fleet.existingSecret to fail the render"; exit 1
          fi

  image-scan:
    name: ${{ matrix.image }} CVE scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Same matrix as release.yaml's `images` job — the scan must cover
      # exactly what a release would ship.
      matrix:
        include:
          - image: control-plane
            context: control-plane
            dockerfile: control-plane/Dockerfile
            target: runner
          - image: control-plane-migrate
            context: control-plane
            dockerfile: control-plane/Dockerfile
            target: builder
          - image: otelcol-chopper
            # The collector Dockerfile copies data-plane/ from the repo root.
            context: .
            dockerfile: deploy/docker/Dockerfile.collector
            target: ""
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same cache scopes as release.yaml, so a green scan here also primes
      # the layer cache the release build will reuse.
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: chopper-ci/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # Report-only pass over HIGH and CRITICAL. The gate below blocks only on
      # CRITICAL, which let two HIGH remote-DoS gRPC advisories ship in
      # otelcol-chopper unnoticed (fixed in #4). Findings land in the job
      # summary plus a warning annotation on the PR, and never fail the
      # build. Runs before the gate so the report exists even when the gate
      # fails. Same SHA pin as the gate (see below).
      - name: Report HIGH and CRITICAL CVEs (non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chopper-ci/${{ matrix.image }}:${{ github.sha }}
          format: json
          output: trivy-report.json
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Summarize findings
        continue-on-error: true
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ ! -s trivy-report.json ]; then
            echo "::warning title=Trivy (${IMAGE})::report missing, see the scan step log"
            exit 0
          fi
          count=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-report.json)
          {
            echo "### Trivy: ${IMAGE} has ${count} HIGH/CRITICAL finding(s)"
            if [ "$count" -gt 0 ]; then
              echo
              echo "| Severity | Package | Installed | Fixed in | ID |"
              echo "|---|---|---|---|---|"
              jq -r '[.Results[]?.Vulnerabilities[]?] | sort_by(.Severity, .PkgName)[]
                | "| \(.Severity) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "no fix yet") | [\(.VulnerabilityID)](\(.PrimaryURL // "https://avd.aquasec.com/nvd/\(.VulnerabilityID | ascii_downcase)")) |"' trivy-report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=Trivy (${IMAGE})::${count} HIGH/CRITICAL vulnerabilities, see the job summary"
          fi

      # Pinned to the v0.36.0 commit SHA, not the tag: trivy-action's mutable
      # tags (0.0.1–0.34.2) were compromised via imposter commits in March
      # 2026. SHA pins are immutable; bump them deliberately.
      - name: Fail on CRITICAL CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chopper-ci/${{ matrix.image }}:${{ github.sha }}
          format: table
          # CVE gate only. Trivy's secret scanner would flag the deterministic
          # dev fleet key baked into the collector's default config.
          scanners: vuln
          severity: CRITICAL
          # Unfixed CRITICALs fail too (no ignore-unfixed): a base image with
          # no patched package yet still blocks until we swap the base or
          # explicitly .trivyignore it with a rationale.
          exit-code: "1"

  sandbox-image:
    name: loadgen image (build only)
    runs-on: ubuntu-latest
    # Deliberately NOT in image-scan's matrix: that matrix mirrors
    # release.yaml, and loadgen is a local-only sandbox tool that is never
    # pushed or tagged. This only proves the Dockerfile still builds.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox/loadgen
          file: deploy/sandbox/loadgen/Dockerfile
          push: false
          cache-from: type=gha,scope=loadgen
          cache-to: type=gha,scope=loadgen,mode=max
