# Environment for the telemetry-chopper service, read by systemd
# (EnvironmentFile in telemetry-chopper.service). Readable by root and the
# service only, so it's the place for exporter credentials referenced from
# config.yaml as ${env:NAME}.

# Command-line options for otelcol-chopper.
OTELCOL_OPTIONS="--config=/etc/telemetry-chopper/config.yaml"

# Example exporter credential:
# VENDOR_API_KEY=
