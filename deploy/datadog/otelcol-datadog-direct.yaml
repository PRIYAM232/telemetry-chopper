# Collector config for the Datadog test harness in direct mode
# (DD_INTAKE=direct): otelcol-datadog.yaml with the hot exporters pointed
# straight at Datadog's OTLP intake (https://otlp.<DD_SITE>/v1/...) instead
# of a Datadog Agent, authenticated with DD_API_KEY. No Agent runs in this
# mode. ROUTE cold-storage traffic still goes to debug/cold and never
# reaches Datadog.
# Fleet ID and key are the deterministic LOCAL DEV values provisioned by the
# control-plane-migrate one-shot (prisma db seed) — rotate for any real
# deployment.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Traces from Datadog tracing libraries (dd-trace-*), on the Datadog
  # Agent's trace port. Point DD_TRACE_AGENT_URL at the collector. With no
  # Agent to forward them to, everything else tracers send to this port
  # (profiles, Data Streams Monitoring, remote configuration...) is
  # discarded, so run.sh send-ddextras needs agent mode.
  datadog:
    endpoint: 0.0.0.0:8126

processors:
  # Sheds load before the collector runs out of memory (issue #48): above
  # the soft limit (limit - spike, here 55% of the memory available to the
  # process, i.e. the container limit when there is one) the OTLP receiver
  # answers with a retryable error, so senders back off instead of the
  # collector being OOM-killed. Must be first in every ingest pipeline.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  # Keeps spans from Datadog tracing libraries looking the same in Datadog
  # APM. The datadog receiver turns them into OTel spans, keeping the
  # original operation name as the span name and the resource in
  # dd.span.Resource; without these two attributes the Agent would rename
  # flask.request to http.server.request and replace a query's resource.
  # Runs after chopper_filter, so dropped spans cost nothing and a REDACT
  # rule on dd.span.Resource also covers the copy.
  transform/datadog:
    error_mode: ignore
    trace_statements:
      - set(span.attributes["operation.name"], span.name) where span.attributes["dd.span.Resource"] != nil and span.attributes["operation.name"] == nil
      - set(span.attributes["resource.name"], span.attributes["dd.span.Resource"]) where span.attributes["dd.span.Resource"] != nil and span.attributes["resource.name"] == nil
  chopper_filter:
    log_span_details: false
    sync_endpoint: http://control-plane:3000/api/v1/policies/f1ee7000-0000-4000-8000-000000000001
    sync_interval: 10s
    stats_endpoint: http://control-plane:3000/api/v1/telemetry/f1ee7000-0000-4000-8000-000000000001/stats
    stats_interval: 10s
    fleet_key: chopper_dev_sk_2f7d1b9c4e8a4f60b3d5a9c1e6f80712

connectors:
  routing/traces:
    default_pipelines: [traces/hot]
    table:
      - context: resource
        condition: attributes["chopper.routing.destination"] == "cold-storage"
        pipelines: [traces/cold]
  routing/logs:
    default_pipelines: [logs/hot]
    table:
      - context: resource
        condition: attributes["chopper.routing.destination"] == "cold-storage"
        pipelines: [logs/cold]
  routing/metrics:
    default_pipelines: [metrics/hot]
    table:
      - context: resource
        condition: attributes["chopper.routing.destination"] == "cold-storage"
        pipelines: [metrics/cold]

exporters:
  # Everything not routed to cold storage goes straight to Datadog's OTLP
  # intake: OTLP/HTTP protobuf with the API key in dd-api-key. One exporter
  # per signal, because the headers differ.
  #  - traces: compute_stats asks Datadog to compute trace metrics (hits,
  #    errors, latency), which it doesn't do for this intake by default; it
  #    computes them from the spans that arrive, so after the rules.
  #    span_name_as_resource_name: false matches the Agent's resource naming
  #    (this intake defaults to true).
  #  - metrics: the intake accepts delta temporality only. send.py sends
  #    gauges; cumulative sums would be rejected.
  otlp_http/datadog-traces:
    traces_endpoint: https://otlp.${env:DD_SITE}/v1/traces
    headers:
      dd-api-key: ${env:DD_API_KEY}
      compute_stats: "true"
      dd-otel-span-mapping: '{"span_name_as_resource_name": false}'
  otlp_http/datadog-logs:
    logs_endpoint: https://otlp.${env:DD_SITE}/v1/logs
    headers:
      dd-api-key: ${env:DD_API_KEY}
  otlp_http/datadog-metrics:
    metrics_endpoint: https://otlp.${env:DD_SITE}/v1/metrics
    headers:
      dd-api-key: ${env:DD_API_KEY}
  debug/cold:
    verbosity: basic

service:
  telemetry:
    logs:
      # chopper_filter emits its batch observations at debug level.
      level: debug
    # Self-metrics on :8888 (host 127.0.0.1:18898): run.sh check reads the
    # receiver and exporter counters from here.
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_scope_info: true
                without_type_suffix: true
                without_units: true
  pipelines:
    traces/in:
      receivers: [otlp, datadog]
      processors: [memory_limiter, chopper_filter, transform/datadog]
      exporters: [routing/traces]
    logs/in:
      receivers: [otlp]
      processors: [memory_limiter, chopper_filter]
      exporters: [routing/logs]
    metrics/in:
      receivers: [otlp]
      processors: [memory_limiter, chopper_filter]
      exporters: [routing/metrics]

    traces/hot:
      receivers: [routing/traces]
      exporters: [otlp_http/datadog-traces]
    traces/cold:
      receivers: [routing/traces]
      exporters: [debug/cold]
    logs/hot:
      receivers: [routing/logs]
      exporters: [otlp_http/datadog-logs]
    logs/cold:
      receivers: [routing/logs]
      exporters: [debug/cold]
    metrics/hot:
      receivers: [routing/metrics]
      exporters: [otlp_http/datadog-metrics]
    metrics/cold:
      receivers: [routing/metrics]
      exporters: [debug/cold]
