# Default values for telemetry-chopper.
#
# Image defaults are the local dev tags produced by the repo's Docker builds
# (see deploy/helm/telemetry-chopper/README.md for the build + `kind load`
# commands). Nothing here is published to a registry — pullPolicy stays
# IfNotPresent so kind/minikube use the pre-loaded images.
#
# Resource names are derived from the release name: install as `chopper` and
# you get chopper-control-plane, chopper-collector, chopper-postgres — the DNS
# names baked into the collector config.

controlPlane:
  image:
    repository: telemetry-chopper/control-plane
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

migrator:
  # The control-plane Dockerfile's `builder` stage — the only image carrying
  # the Prisma CLI plus schema, migrations, and the seed script. Runs as a
  # one-shot hook Job (see templates/migration-job.yaml).
  image:
    repository: telemetry-chopper/control-plane-migrate
    tag: dev
    pullPolicy: IfNotPresent
  backoffLimit: 3
  activeDeadlineSeconds: 600
  # `prisma db seed` provisions the deterministic dev fleet that fleet.id /
  # fleet.key below point at. The seed is idempotent for the dev fleet;
  # disable once real fleets are provisioned through the dashboard.
  seed: true

collector:
  # The horizontally scalable data plane. An edge proxy, not a node agent —
  # Deployment, not DaemonSet. Raise replicas as telemetry volume grows.
  image:
    repository: telemetry-chopper/otelcol-chopper
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    # ClusterIP serves in-cluster telemetry producers; switch to LoadBalancer
    # to expose OTLP 4317/4318 to producers outside the cluster.
    type: ClusterIP
  # chopper_filter emits its batch observations at debug level; raise to info
  # to quiet the collector once the stack is verified.
  telemetryLogLevel: debug
  # Per-span walks don't belong in a packaged run (same stance as V1's
  # otelcol-docker.yaml).
  logSpanDetails: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # Identity for the archive exporters below. Leave create: false to run as
  # the namespace's default ServiceAccount. For cloud workload identity,
  # create one and annotate it, e.g.
  #   EKS IRSA:  eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/chopper-archive
  #   AKS:       azure.workload.identity/client-id: <managed-identity-client-id>
  #              (AKS also needs podLabels: { azure.workload.identity/use: "true" })
  serviceAccount:
    create: false
    # Defaults to <release>-collector when create is true.
    name: ""
    annotations: {}
  podLabels: {}
  podAnnotations: {}
  # Pod-level securityContext. The image runs as the distroless nonroot user
  # (uid/gid 65532); a file archive on a PVC usually needs fsGroup: 65532 so
  # that user can write to it. NFS ignores fsGroup — set ownership on the
  # export instead.
  podSecurityContext: {}
  # Extra environment for the collector container, e.g. static cloud
  # credentials from an existing Secret. The collector config can read any of
  # these as ${env:NAME}, so secrets never land in the ConfigMap.
  extraEnv: []
  #  - name: AWS_ACCESS_KEY_ID
  #    valueFrom: { secretKeyRef: { name: chopper-archive-aws, key: access-key-id } }
  extraEnvFrom: []
  #  - secretRef: { name: chopper-archive-azure }

  # Archive exporters for the traces/cold, logs/cold and metrics/cold
  # pipelines, i.e. everything a ROUTE rule sends to "cold-storage" (see the
  # README's "Archiving to cold storage"). Any combination can be enabled;
  # every enabled exporter receives all cold data. With none enabled, the
  # cold pipelines end in the debug exporter, as before.
  # All three exporters are alpha upstream (collector contrib v0.156.0).
  coldStorage:
    # Batch before each upload so archive tiers get fewer, larger objects
    # (archive classes bill per object and have minimum storage durations).
    # Applies to the s3 and azureBlob exporters.
    batchFlushTimeout: 5m

    s3:
      enabled: false
      region: us-east-1
      bucket: ""
      prefix: telemetry
      # STANDARD, STANDARD_IA, GLACIER_IR, GLACIER, DEEP_ARCHIVE, ...
      storageClass: DEEP_ARCHIVE
      compression: gzip
      # otlp_json or otlp_proto.
      marshaler: otlp_json
      # Only for S3-compatible stores (MinIO, Ceph, ...); leave empty for AWS.
      endpoint: ""
      forcePathStyle: false
      # Credentials come from the standard AWS chain: IRSA (serviceAccount
      # annotation above) or AWS_* variables via extraEnv/extraEnvFrom.

    azureBlob:
      enabled: false
      # Storage account endpoint, e.g. https://acmeaudit.blob.core.windows.net/
      # Not needed when auth.type is connection_string.
      url: ""
      # Passed through as the exporter's auth block. Types:
      # connection_string, service_principal, system_managed_identity,
      # user_managed_identity, workload_identity. Keep secrets out of values:
      #   { type: connection_string, connection_string: "${env:AZURE_STORAGE_CONNECTION_STRING}" }
      auth:
        type: workload_identity
      # Containers must already exist; the exporter doesn't create them.
      # Azure has no per-blob tier setting in the exporter: add a lifecycle
      # management rule on the account to move blobs to the Archive tier.
      containers:
        traces: traces
        logs: logs
        metrics: metrics
      format: json

    file:
      enabled: false
      # Directory the archive volume is mounted at. Each pod writes its own
      # file per signal under it: traces-<pod>.jsonl, logs-<pod>.jsonl,
      # metrics-<pod>.jsonl, so replicas can share one volume.
      mountPath: /var/lib/otelcol/archive
      # Any Kubernetes volume source for that directory. Required when
      # enabled, e.g.
      #   nfs: { server: nas.internal, path: /exports/telemetry }
      #   persistentVolumeClaim: { claimName: chopper-archive }
      volume: {}
      rotation:
        maxMegabytes: 512
        # 0 keeps every rotated file.
        maxBackups: 0
      # "" writes plain JSON lines (readable with grep/jq). "zstd" compresses
      # each batch into a length-prefixed frame that `zstd -d` can't read
      # directly — compress when moving files to offline media instead.
      compression: ""

metrics:
  # Phase 10 self-monitoring. The collector ALWAYS serves its own metrics
  # (Prometheus text format at /metrics) on this port — stock otelcol_*
  # process/pipeline metrics plus the otelcol_chopper_filter_* rules/throughput
  # instruments. The two blocks below only control how the surrounding
  # monitoring stack discovers them; both default off so the chart keeps
  # installing on clusters without the Prometheus Operator CRDs or Grafana.
  port: 8888

  serviceMonitor:
    # Deploys a monitoring.coreos.com/v1 ServiceMonitor targeting the
    # collector Service's `metrics` port. Requires the Prometheus Operator
    # CRDs (e.g. kube-prometheus-stack) — installing with this enabled on a
    # cluster without them fails at apply time.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels for Prometheus instance selection — kube-prometheus-stack
    # defaults to serviceMonitorSelector matching `release: <its release>`,
    # e.g.:  additionalLabels: { release: kube-prometheus-stack }
    additionalLabels: {}

  dashboard:
    # Ships the pre-built Grafana dashboard as a ConfigMap labelled
    # grafana_dashboard: "1" so Grafana's dashboard sidecar auto-imports it.
    enabled: false
    # Namespace to create the ConfigMap in when the sidecar only watches its
    # own namespace (searchNamespace). Empty → the release namespace.
    namespace: ""
    additionalLabels: {}
    # Sidecar folder routing, e.g.: annotations: { grafana_folder: "Telemetry Chopper" }
    annotations: {}

fleet:
  # Deterministic LOCAL DEV fleet provisioned by the migrator's seed step —
  # rotate both values for any real deployment.
  id: f1ee7000-0000-4000-8000-000000000001
  key: chopper_dev_sk_2f7d1b9c4e8a4f60b3d5a9c1e6f80712
  syncInterval: 10s
  statsInterval: 10s

postgres:
  # Self-contained in-cluster Postgres for the local/kind stack. In a real
  # environment use RDS/Cloud SQL instead: set enabled: false and point
  # database.externalUrl at the managed instance.
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  auth:
    username: chopper
    password: chopper
    database: chopper_control
  storage:
    size: 1Gi
    # Empty string → the cluster's default StorageClass (kind and minikube
    # both ship a dynamic local-path provisioner).
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

database:
  # Full connection URL for an external/managed database, e.g.
  # postgresql://user:pass@my-rds:5432/chopper_control?schema=public
  # When set, it overrides the in-chart postgres wiring everywhere
  # (secret, migration job, control plane).
  externalUrl: ""
