{{- if not .Values.fleet.existingSecret }}
# The key the collectors send to the control plane (fleet.key), read by the
# collector as ${env:CHOPPER_FLEET_KEY}. Its own file so that rotating it
# doesn't change secret.yaml, whose checksum restarts the control plane.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-fleet
  labels:
    app.kubernetes.io/name: chopper-fleet
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "telemetry-chopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  CHOPPER_FLEET_KEY: {{ required "fleet.key is required unless fleet.existingSecret is set" .Values.fleet.key | quote }}
{{- end }}
