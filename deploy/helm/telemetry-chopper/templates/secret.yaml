# DATABASE_URL for the control plane. The migration job renders the same
# helper inline instead of referencing this secret — during a pre-upgrade
# hook the cluster still holds the PREVIOUS release's secret, and migrations
# must run against the URL the upgrade is about to install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  labels:
    app.kubernetes.io/name: chopper-database
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "telemetry-chopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "telemetry-chopper.databaseUrl" . | quote }}
{{- if not .Values.controlPlane.admin.existingSecret }}
---
# The first operator's sign-in (see controlPlane.admin in values.yaml). A
# generated password is looked up from the live Secret on upgrade, so it
# doesn't change under someone who hasn't signed in yet.
{{- $name := printf "%s-admin" .Release.Name }}
{{- $password := .Values.controlPlane.admin.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "CHOPPER_ADMIN_PASSWORD") }}
{{- $password = index $existing.data "CHOPPER_ADMIN_PASSWORD" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: chopper-admin
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "telemetry-chopper.labels" . | nindent 4 }}
type: Opaque
stringData:
  CHOPPER_ADMIN_EMAIL: {{ .Values.controlPlane.admin.email | quote }}
  CHOPPER_ADMIN_PASSWORD: {{ $password | quote }}
{{- end }}
