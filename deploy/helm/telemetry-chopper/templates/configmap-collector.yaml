# otelcol-k8s.yaml — the in-cluster twin of deploy/docker/otelcol-docker.yaml
# (see data-plane/config/otelcol-dev.yaml for the full pipeline commentary).
# Identical pipeline topology; only the deployment-specific knobs are
# templated: control-plane endpoints resolve the Kubernetes Service name,
# and fleet credentials / intervals / log verbosity come from values.yaml.
#
# The collector Deployment mounts this at /etc/otelcol/otelcol-k8s.yaml
# (shadowing the image's baked-in localhost dev config) and stamps a
# checksum of it on the pod template, so `helm upgrade` with a changed
# config rolls the collector pods automatically.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-collector-config
  labels:
    app.kubernetes.io/name: chopper-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- include "telemetry-chopper.labels" . | nindent 4 }}
data:
  otelcol-k8s.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      {{- if .Values.collector.datadogReceiver.enabled }}
      # Datadog tracing libraries (collector.datadogReceiver).
      datadog:
        endpoint: 0.0.0.0:{{ .Values.collector.datadogReceiver.port }}
      {{- end }}

    {{- if .Values.collector.persistentQueue.enabled }}
    extensions:
      # Persistent exporter queues (collector.persistentQueue).
      file_storage:
        directory: /var/lib/otelcol/file_storage
        timeout: 1s
        compaction:
          on_start: true
          on_rebound: true
          directory: /var/lib/otelcol/file_storage
    {{- end }}

    processors:
      # First in every ingest pipeline (collector.memoryLimiter).
      memory_limiter:
        check_interval: {{ .Values.collector.memoryLimiter.checkInterval }}
        limit_percentage: {{ .Values.collector.memoryLimiter.limitPercentage }}
        spike_limit_percentage: {{ .Values.collector.memoryLimiter.spikeLimitPercentage }}
      chopper_filter:
        log_span_details: {{ .Values.collector.logSpanDetails }}
        sync_endpoint: {{ include "telemetry-chopper.controlPlaneUrl" . }}/api/v1/policies/{{ .Values.fleet.id }}
        sync_interval: {{ .Values.fleet.syncInterval }}
        stats_endpoint: {{ include "telemetry-chopper.controlPlaneUrl" . }}/api/v1/telemetry/{{ .Values.fleet.id }}/stats
        stats_interval: {{ .Values.fleet.statsInterval }}
        # From the fleet Secret via the container env (fleet.key or
        # fleet.existingSecret), so the key isn't stored in this ConfigMap.
        fleet_key: ${env:CHOPPER_FLEET_KEY}
      {{- if .Values.collector.datadogReceiver.enabled }}
      # Keeps Datadog-traced spans' operation and resource names: the Datadog
      # Agent honors operation.name and resource.name on OTLP spans. After
      # chopper_filter, so a REDACT rule on dd.span.Resource covers the copy.
      transform/datadog:
        error_mode: ignore
        trace_statements:
          - set(span.attributes["operation.name"], span.name) where span.attributes["dd.span.Resource"] != nil and span.attributes["operation.name"] == nil
          - set(span.attributes["resource.name"], span.attributes["dd.span.Resource"]) where span.attributes["dd.span.Resource"] != nil and span.attributes["resource.name"] == nil
      {{- end }}

    connectors:
      routing/traces:
        default_pipelines: [traces/hot]
        table:
          - context: resource
            condition: attributes["chopper.routing.destination"] == "cold-storage"
            pipelines: [traces/cold]
      routing/logs:
        default_pipelines: [logs/hot]
        table:
          - context: resource
            condition: attributes["chopper.routing.destination"] == "cold-storage"
            pipelines: [logs/cold]
      routing/metrics:
        default_pipelines: [metrics/hot]
        table:
          - context: resource
            condition: attributes["chopper.routing.destination"] == "cold-storage"
            pipelines: [metrics/cold]

    exporters:
      {{- with .Values.collector.hotBackend.otlp }}
      {{- if .endpoint }}
      # Hot backend (collector.hotBackend.otlp).
      otlp_grpc/hot:
        endpoint: {{ .endpoint | quote }}
        tls:
          insecure: {{ .insecure }}
        {{- with .headers }}
        headers:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        sending_queue:
          {{- if $.Values.collector.persistentQueue.enabled }}
          storage: file_storage
          {{- end }}
          batch:
            flush_timeout: 1s
      {{- end }}
      {{- end }}
      debug/hot:
        verbosity: basic
      debug/cold:
        verbosity: basic
      {{- with .Values.collector.coldStorage }}
      {{- if .s3.enabled }}
      # Archive exporters (collector.coldStorage) for the */cold pipelines.
      awss3/archive:
        s3uploader:
          region: {{ .s3.region | quote }}
          s3_bucket: {{ .s3.bucket | quote }}
          s3_prefix: {{ .s3.prefix | quote }}
          storage_class: {{ .s3.storageClass | quote }}
          {{- if .s3.compression }}
          compression: {{ .s3.compression | quote }}
          {{- end }}
          {{- if .s3.endpoint }}
          endpoint: {{ .s3.endpoint | quote }}
          {{- end }}
          s3_force_path_style: {{ .s3.forcePathStyle }}
        marshaler: {{ .s3.marshaler | quote }}
        sending_queue:
          {{- if $.Values.collector.persistentQueue.enabled }}
          storage: file_storage
          {{- end }}
          batch:
            flush_timeout: {{ .batchFlushTimeout }}
      {{- end }}
      {{- if .azureBlob.enabled }}
      azure_blob/archive:
        {{- if .azureBlob.url }}
        url: {{ .azureBlob.url | quote }}
        {{- end }}
        auth:
          {{- toYaml .azureBlob.auth | nindent 10 }}
        container:
          {{- toYaml .azureBlob.containers | nindent 10 }}
        format: {{ .azureBlob.format | quote }}
        sending_queue:
          {{- if $.Values.collector.persistentQueue.enabled }}
          storage: file_storage
          {{- end }}
          batch:
            flush_timeout: {{ .batchFlushTimeout }}
      {{- end }}
      {{- if .file.enabled }}
      {{- $file := .file }}
      {{- range list "traces" "logs" "metrics" }}
      file/archive-{{ . }}:
        path: {{ printf "%s/%s-${env:POD_NAME}.jsonl" $file.mountPath . | quote }}
        rotation:
          max_megabytes: {{ $file.rotation.maxMegabytes }}
          max_backups: {{ $file.rotation.maxBackups }}
        {{- if $file.compression }}
        compression: {{ $file.compression | quote }}
        {{- end }}
      {{- end }}
      {{- end }}
      {{- end }}

    service:
      {{- if .Values.collector.persistentQueue.enabled }}
      extensions: [file_storage]
      {{- end }}
      telemetry:
        logs:
          level: {{ .Values.collector.telemetryLogLevel }}
        metrics:
          # Self-monitoring endpoint scraped by the ServiceMonitor (see
          # templates/servicemonitor.yaml): Prometheus text format on
          # 0.0.0.0:{{ .Values.metrics.port }}/metrics — 0.0.0.0, not the collector's localhost
          # default, because Prometheus scrapes over the pod network. Serves
          # the stock otelcol_* process/pipeline metrics plus the
          # otelcol_chopper_filter_* instruments (rules, per-signal
          # received/dropped). The without_* flags pin the classic collector
          # metric names — no _total/unit suffixes — which the bundled
          # Grafana dashboard (files/chopper-collector-dashboard.json)
          # addresses verbatim.
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: {{ .Values.metrics.port }}
                    without_scope_info: true
                    without_type_suffix: true
                    without_units: true
      pipelines:
        traces/in:
          {{- if .Values.collector.datadogReceiver.enabled }}
          receivers: [otlp, datadog]
          processors: [memory_limiter, chopper_filter, transform/datadog]
          {{- else }}
          receivers: [otlp]
          processors: [memory_limiter, chopper_filter]
          {{- end }}
          exporters: [routing/traces]
        logs/in:
          receivers: [otlp]
          processors: [memory_limiter, chopper_filter]
          exporters: [routing/logs]
        metrics/in:
          receivers: [otlp]
          processors: [memory_limiter, chopper_filter]
          exporters: [routing/metrics]

        traces/hot:
          receivers: [routing/traces]
          exporters: [{{ if .Values.collector.hotBackend.otlp.endpoint }}otlp_grpc/hot{{ else }}debug/hot{{ end }}]
        traces/cold:
          receivers: [routing/traces]
          exporters: {{ include "telemetry-chopper.coldExporters" (dict "root" $ "signal" "traces") }}
        logs/hot:
          receivers: [routing/logs]
          exporters: [{{ if .Values.collector.hotBackend.otlp.endpoint }}otlp_grpc/hot{{ else }}debug/hot{{ end }}]
        logs/cold:
          receivers: [routing/logs]
          exporters: {{ include "telemetry-chopper.coldExporters" (dict "root" $ "signal" "logs") }}
        metrics/hot:
          receivers: [routing/metrics]
          exporters: [{{ if .Values.collector.hotBackend.otlp.endpoint }}otlp_grpc/hot{{ else }}debug/hot{{ end }}]
        metrics/cold:
          receivers: [routing/metrics]
          exporters: {{ include "telemetry-chopper.coldExporters" (dict "root" $ "signal" "metrics") }}
